<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        /* Blueprint canvas — a quiet drafting surface, not a page inside the page.
           Dot-grid paper, a few guide lines that grow out of the shell's header and
           sidebar edges, small crosses where they meet, one empty artboard with corner
           ticks, and a slow light glide. No text, no logo, no controls. */
        :root {
            --line: rgba(0, 0, 0, 0.10);            /* guide lines (the agreed hairline)  */
            --line-strong: rgba(0, 0, 0, 0.18);     /* crosses, corner ticks              */
            --dot: rgba(0, 0, 0, 0.09);             /* grid dots                          */
            --tint: rgba(22, 119, 255, 0.06);       /* ambient brand wash, top-left       */
            --glide: rgba(22, 119, 255, 0.55);      /* the light running along a guide    */
            --board: rgba(255, 255, 255, 0.35);     /* artboard fill                      */
        }

        /* the shell behind the frame may be dark; same drawing, inverted ink */
        html.dark {
            --line: rgba(255, 255, 255, 0.10);
            --line-strong: rgba(255, 255, 255, 0.20);
            --dot: rgba(255, 255, 255, 0.09);
            --tint: rgba(22, 119, 255, 0.10);
            --glide: rgba(102, 170, 255, 0.60);
            --board: rgba(255, 255, 255, 0.03);
        }

        /* No backdrop on purpose: the shell already paints one behind this frame —
           a plain surface, a dark one, or the Liquid Glass field. The dot grid is
           transparent between the dots, so it sits on any of them. */
        body {
            overflow: hidden;
            background-image:
                radial-gradient(1200px 700px at 0% 0%, var(--tint), transparent 60%),
                radial-gradient(circle, var(--dot) 1px, transparent 1.4px);
            background-size: auto, 24px 24px;
            background-position: 0 0, 12px 12px;
        }

        /* ── guide lines: horizontals grow from the sidebar edge (left), verticals
              from the header edge (top) — the shell's structure continued ── */
        .h, .v {
            position: fixed;
            background: var(--line);
        }
        .h {
            left: 0; right: 0;
            height: 1px;
            transform-origin: left center;
            transform: scaleX(0);
            animation: grow-x 1.6s cubic-bezier(.22, 1, .36, 1) forwards;
        }
        .v {
            top: 0; bottom: 0;
            width: 1px;
            transform-origin: center top;
            transform: scaleY(0);
            animation: grow-y 1.6s cubic-bezier(.22, 1, .36, 1) forwards;
        }
        @keyframes grow-x { to { transform: scaleX(1); } }
        @keyframes grow-y { to { transform: scaleY(1); } }

        .h1 { top: 22%;  animation-delay: .10s; }
        .h2 { top: 78%;  animation-delay: .35s; }
        .v1 { left: 18%; animation-delay: .20s; }
        .v2 { left: 82%; animation-delay: .45s; }

        /* ── crosses at the intersections ── */
        .x {
            position: fixed;
            width: 11px; height: 11px;
            margin: -5px 0 0 -5px;
            opacity: 0;
            animation: fade .6s ease forwards;
        }
        .x::before, .x::after {
            content: "";
            position: absolute;
            background: var(--line-strong);
        }
        .x::before { left: 0; right: 0; top: 5px; height: 1px; }
        .x::after  { top: 0; bottom: 0; left: 5px; width: 1px; }
        @keyframes fade { to { opacity: 1; } }

        .x11 { top: 22%; left: 18%; animation-delay: 1.4s; }
        .x12 { top: 22%; left: 82%; animation-delay: 1.5s; }
        .x21 { top: 78%; left: 18%; animation-delay: 1.6s; }
        .x22 { top: 78%; left: 82%; animation-delay: 1.7s; }

        /* ── the artboard: the empty page waiting to be built ── */
        .board {
            position: fixed;
            top: 22%; bottom: 22%;
            left: 18%; right: 18%;
            background: var(--board);
            opacity: 0;
            animation: fade 1s ease 1.2s forwards;
        }
        /* corner ticks sit just outside the frame, like a drafting sheet */
        .tick {
            position: fixed;
            width: 14px; height: 14px;
            opacity: 0;
            animation: fade .5s ease forwards;
        }
        .tick::before, .tick::after {
            content: "";
            position: absolute;
            background: var(--line-strong);
        }
        .tick::before { width: 14px; height: 1px; }
        .tick::after  { width: 1px;  height: 14px; }
        .t1 { top: calc(22% - 20px); left: calc(18% - 20px); animation-delay: 1.8s; }
        .t1::before { bottom: 0; right: 0; } .t1::after { bottom: 0; right: 0; }
        .t2 { top: calc(22% - 20px); right: calc(18% - 20px); animation-delay: 1.9s; }
        .t2::before { bottom: 0; left: 0; }  .t2::after { bottom: 0; left: 0; }
        .t3 { bottom: calc(22% - 20px); left: calc(18% - 20px); animation-delay: 2.0s; }
        .t3::before { top: 0; right: 0; }    .t3::after { top: 0; right: 0; }
        .t4 { bottom: calc(22% - 20px); right: calc(18% - 20px); animation-delay: 2.1s; }
        .t4::before { top: 0; left: 0; }     .t4::after { top: 0; left: 0; }

        /* ── glide: a short light runs along the upper guide, rarely ── */
        .glide {
            position: fixed;
            top: 22%;
            left: 0;
            width: 22%;
            height: 1px;
            margin-top: 0;
            background: linear-gradient(90deg, transparent, var(--glide) 60%, transparent);
            opacity: 0;
            animation: glide 9s cubic-bezier(.4, 0, .2, 1) 2.6s infinite;
        }
        @keyframes glide {
            0%        { transform: translateX(-100%); opacity: 0; }
            4%        { opacity: 1; }
            34%       { opacity: 1; }
            40%, 100% { transform: translateX(460%); opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .h, .v, .x, .board, .tick { animation-duration: 0s; animation-delay: 0s; }
            .glide { display: none; }
        }
    </style>
</head>
<body>
    <div class="h h1"></div>
    <div class="h h2"></div>
    <div class="v v1"></div>
    <div class="v v2"></div>

    <div class="board"></div>
    <div class="tick t1"></div>
    <div class="tick t2"></div>
    <div class="tick t3"></div>
    <div class="tick t4"></div>

    <div class="x x11"></div>
    <div class="x x12"></div>
    <div class="x x21"></div>
    <div class="x x22"></div>

    <div class="glide"></div>

    <script>
        // Follow the shell's dark theme (same origin): mirror the parent's `dark`
        // class so the ink inverts; skins are deliberately not mirrored.
        (function () {
            try {
                var root = window.parent && window.parent.document.documentElement;
                if (!root || root === document.documentElement) return;
                var sync = function () {
                    document.documentElement.classList.toggle("dark", root.classList.contains("dark"));
                };
                sync();
                new MutationObserver(sync).observe(root, {attributes: true, attributeFilter: ["class"]});
            } catch (e) { /* cross-origin embed: keep the light ink */ }
        })();
    </script>
</body>
</html>
