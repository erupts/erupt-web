<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title></title>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="force-rendering" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1,user-scalable=no">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <meta name="renderer" content="webkit">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="black">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#E7E9E8">
    <style>
        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 9999;
            transition: opacity .5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: #fff url('assets/passport/passport-bg.svg') no-repeat center center / cover;
            --pl-accent: #1677ff;
        }

        /* soft breathing halo behind the grid */
        .preloader::before {
            content: '';
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: radial-gradient(circle,
                color-mix(in srgb, var(--pl-accent) 10%, transparent) 0%,
                transparent 65%);
            animation: plHalo 3.2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes plHalo {
            0%, 100% { transform: scale(1);    opacity: .7; }
            50%      { transform: scale(1.18); opacity: 1; }
        }

        /* ---- default skin: comet-tail orbit rings ---- */
        .pl-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            animation: plFadeUp .7s cubic-bezier(.22, 1, .36, 1) both;
        }

        @keyframes plFadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: none; }
        }

        .pl-orbit {
            position: relative;
            width: 92px;
            height: 92px;
        }

        .pl-ring {
            position: absolute;
            border-radius: 50%;
            background: conic-gradient(transparent var(--pl-tail), var(--pl-ring-color));
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
            animation: plSpin linear infinite;
        }

        /* rounded comet head at the leading edge (top of the ring) */
        .pl-ring::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 3px;
            height: 3px;
            margin-left: -1.5px;
            border-radius: 50%;
            background: var(--pl-ring-color);
        }

        .pl-ring:nth-child(1) {
            inset: 0;
            --pl-tail: 18%;
            --pl-ring-color: var(--pl-accent);
            animation-duration: 1.5s;
        }

        .pl-ring:nth-child(2) {
            inset: 14px;
            --pl-tail: 30%;
            --pl-ring-color: color-mix(in srgb, var(--pl-accent) 55%, transparent);
            animation-duration: 2.2s;
            animation-direction: reverse;
        }

        .pl-ring:nth-child(3) {
            inset: 28px;
            --pl-tail: 42%;
            --pl-ring-color: color-mix(in srgb, var(--pl-accent) 32%, transparent);
            animation-duration: 1.1s;
        }

        @keyframes plSpin {
            to { transform: rotate(1turn); }
        }

        .pl-core {
            position: absolute;
            inset: 0;
            margin: auto;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--pl-accent);
            animation: plCore 1.6s ease-in-out infinite;
        }

        @keyframes plCore {
            0%, 100% { transform: scale(1);  opacity: 1; }
            50%      { transform: scale(.55); opacity: .5; }
        }

        .pl-brand {
            color: rgba(0, 0, 0, 0.72);
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.14em;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            white-space: nowrap;
            line-height: 1;
            padding-left: 0.14em;
            animation: plBrandBreathe 2.4s ease-in-out infinite;
        }

        @keyframes plBrandBreathe {
            0%, 100% { opacity: .55; }
            50%      { opacity: .95; }
        }

        #preloader-tip {
            text-align: center;
            color: rgba(0, 0, 0, 0.40);
            font-size: 12px;
            position: absolute;
            left: 0;
            right: 0;
            bottom: 24px;
            animation: tipFadeIn 6s;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            letter-spacing: 0.02em;
        }

        @keyframes tipFadeIn {
            0%, 88% { opacity: 0; }
            100%    { opacity: 1; }
        }

        /* ---- brutalist skin (html.brutalist-theme) ---- */
        html.brutalist-theme .preloader {
            background-color: #e3ebee;
            --pl-accent: #0a0a0a;
        }

        html.brutalist-theme .preloader::before {
            display: none;
        }

        html.brutalist-theme .pl-content {
            animation: none;
        }

        html.brutalist-theme .pl-ring {
            /* inline --pl-accent from site config must not tint the hard skin */
            --pl-ring-color: #0a0a0a !important;
            animation-timing-function: steps(12);
        }

        html.brutalist-theme .pl-core {
            background: #0a0a0a;
            border-radius: 0;
            animation-timing-function: steps(2, jump-none);
        }

        html.brutalist-theme .pl-brand {
            color: #0a0a0a;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
            padding-left: 0.28em;
            animation: none;
        }

        html.brutalist-theme #preloader-tip {
            color: rgba(10, 10, 10, 0.5);
            font-size: 11px;
            font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        /* ---- dark theme (html.dark) ---- */
        html.dark .preloader {
            background: #141414;
            --pl-accent: #1677ff;
        }

        html.dark .pl-brand {
            color: rgba(255, 255, 255, 0.85);
        }

        html.dark #preloader-tip {
            color: rgba(255, 255, 255, 0.45);
        }

        html.dark.brutalist-theme .preloader {
            background-color: #141414;
            --pl-accent: #f5f5f0;
        }

        html.dark.brutalist-theme .pl-ring {
            --pl-ring-color: #f5f5f0 !important;
        }

        html.dark.brutalist-theme .pl-core,
        html.dark.brutalist-theme .pl-brand {
            background: none;
            color: #f5f5f0;
        }

        html.dark.brutalist-theme .pl-core {
            background: #f5f5f0;
        }

        .preloader-hidden-add         { opacity: 1; display: flex; }
        .preloader-hidden-add-active  { opacity: 0; }
        .preloader-hidden             { display: none; }

        @media (prefers-reduced-motion: reduce) {
            .pl-ring, .pl-core, .pl-brand, .pl-content, .preloader::before { animation: none; }
        }
    </style>
</head>
<body>
<div class="preloader">
    <div class="pl-content">
        <div class="pl-orbit">
            <i class="pl-ring"></i>
            <i class="pl-ring"></i>
            <i class="pl-ring"></i>
            <b class="pl-core"></b>
        </div>
        <div class="pl-brand" id="preload-brand">Loading</div>
    </div>
    <div id="preloader-tip">Stuck? Press Ctrl + Shift + R to reload.</div>
</div>
<script>
    window.setTimeout(function () {
        if (!window.eruptWebSuccess) {
            location.reload(true)
        }
    }, 1000 * 20);
    (function (date) {
        var __t__ = '' + date.getFullYear() + date.getMonth() + date.getDate() + date.getHours() + date.getMinutes();
        document.write(
            "<link rel=\"stylesheet\" href=\"app.css?_=" + __t__ + "\" type=\"text/css\"/>" +
            "<script type=\"text/javascript\" src=\"app.js?_=" + __t__ + "\"><\/script>" +
            "<script type=\"module\" src=\"app.module.js?_=" + __t__ + "\" ><\/script>"
        );
        var _preloaderEl = document.querySelector(".preloader");
        var _brandEl = document.getElementById("preload-brand");
        // Optional Brutalist Theme skin — apply a saved user toggle right away so
        // the preloader renders with the correct skin, without waiting for app.js.
        var _nbPref = localStorage.getItem("brutalist-theme");
        if (_nbPref === "true") {
            document.documentElement.classList.add("brutalist-theme");
        }
        // Dark theme: toggles html.dark and lazy-loads the compiled dark
        // stylesheet (style.dark.css). Shared with the settings drawer via
        // window.eruptApplyDarkTheme so the logic lives in one place.
        window.eruptApplyDarkTheme = function (dark) {
            document.documentElement.classList.toggle("dark", dark);
            var link = document.getElementById("site-theme-dark");
            if (dark && !link) {
                link = document.createElement("link");
                link.id = "site-theme-dark";
                link.rel = "stylesheet";
                link.href = "style.dark.css?_=" + __t__;
                document.head.appendChild(link);
            } else if (!dark && link) {
                link.parentNode.removeChild(link);
            }
        };
        var _darkPref = localStorage.getItem("dark-theme");
        if (_darkPref === "true") {
            window.eruptApplyDarkTheme(true);
        }
        // A user-picked theme color (settings drawer) tints the preloader too.
        var _tcPref = localStorage.getItem("theme-color");
        if (_tcPref) {
            _preloaderEl.style.setProperty("--pl-accent", _tcPref);
        }
        var _colorCheckTimer = setInterval(function () {
            if (window.eruptSiteConfig !== undefined) {
                clearInterval(_colorCheckTimer);
                // No saved toggle — fall back to the config flag.
                if (_nbPref === null && window.eruptSiteConfig.brutalistTheme) {
                    document.documentElement.classList.add("brutalist-theme");
                }
                if (_darkPref === null && window.eruptSiteConfig.darkTheme) {
                    window.eruptApplyDarkTheme(true);
                }
                if (_tcPref === null && window.eruptSiteConfig.theme && window.eruptSiteConfig.theme.primaryColor) {
                    _preloaderEl.style.setProperty("--pl-accent", window.eruptSiteConfig.theme.primaryColor);
                }
                if (_brandEl) {
                    _brandEl.textContent = window.eruptSiteConfig.logoText || window.eruptSiteConfig.title || "Loading";
                }
            }
        }, 10);
    })(new Date())
</script>
