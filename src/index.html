<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title></title>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="force-rendering" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1,user-scalable=no">
    <link id="site-favicon" rel="icon" href="favicon.ico">
    <meta name="renderer" content="webkit">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="black">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#E7E9E8">
    <style>
        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 9999;
            transition: opacity .5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: #fff url('assets/passport/passport-bg.svg') no-repeat center center / cover;
            --pl-accent: #1677ff;
        }

        /* soft breathing halo behind the grid */
        .preloader::before {
            content: '';
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: radial-gradient(circle,
                color-mix(in srgb, var(--pl-accent) 10%, transparent) 0%,
                transparent 65%);
            animation: plHalo 3.2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes plHalo {
            0%, 100% { transform: scale(1);    opacity: .7; }
            50%      { transform: scale(1.18); opacity: 1; }
        }

        /* ---- default skin: comet-tail orbit rings ---- */
        .pl-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            animation: plFadeUp .7s cubic-bezier(.22, 1, .36, 1) both;
        }

        @keyframes plFadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: none; }
        }

        .pl-orbit {
            position: relative;
            width: 92px;
            height: 92px;
        }

        .pl-ring {
            position: absolute;
            border-radius: 50%;
            background: conic-gradient(transparent var(--pl-tail), var(--pl-ring-color));
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
            animation: plSpin linear infinite;
        }

        /* rounded comet head at the leading edge (top of the ring) */
        .pl-ring::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 3px;
            height: 3px;
            margin-left: -1.5px;
            border-radius: 50%;
            background: var(--pl-ring-color);
        }

        .pl-ring:nth-child(1) {
            inset: 0;
            --pl-tail: 18%;
            --pl-ring-color: var(--pl-accent);
            animation-duration: 1.5s;
        }

        .pl-ring:nth-child(2) {
            inset: 14px;
            --pl-tail: 30%;
            --pl-ring-color: color-mix(in srgb, var(--pl-accent) 55%, transparent);
            animation-duration: 2.2s;
            animation-direction: reverse;
        }

        .pl-ring:nth-child(3) {
            inset: 28px;
            --pl-tail: 42%;
            --pl-ring-color: color-mix(in srgb, var(--pl-accent) 32%, transparent);
            animation-duration: 1.1s;
        }

        @keyframes plSpin {
            to { transform: rotate(1turn); }
        }

        .pl-core {
            position: absolute;
            inset: 0;
            margin: auto;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--pl-accent);
            animation: plCore 1.6s ease-in-out infinite;
        }

        @keyframes plCore {
            0%, 100% { transform: scale(1);  opacity: 1; }
            50%      { transform: scale(.55); opacity: .5; }
        }

        .pl-brand {
            color: rgba(0, 0, 0, 0.72);
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.14em;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            white-space: nowrap;
            line-height: 1;
            padding-left: 0.14em;
            animation: plBrandBreathe 2.4s ease-in-out infinite;
        }

        @keyframes plBrandBreathe {
            0%, 100% { opacity: .55; }
            50%      { opacity: .95; }
        }

        #preloader-tip {
            text-align: center;
            color: rgba(0, 0, 0, 0.40);
            font-size: 12px;
            position: absolute;
            left: 0;
            right: 0;
            bottom: 24px;
            animation: tipFadeIn 6s;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            letter-spacing: 0.02em;
        }

        @keyframes tipFadeIn {
            0%, 88% { opacity: 0; }
            100%    { opacity: 1; }
        }

        /* ---- brutalist skin (html.brutalist-theme) ---- */
        html.brutalist-theme .preloader {
            background-color: #e3ebee;
            --pl-accent: #0a0a0a;
        }

        html.brutalist-theme .preloader::before {
            display: none;
        }

        html.brutalist-theme .pl-content {
            animation: none;
        }

        html.brutalist-theme .pl-ring {
            /* inline --pl-accent from site config must not tint the hard skin */
            --pl-ring-color: #0a0a0a !important;
            animation-timing-function: steps(12);
        }

        html.brutalist-theme .pl-core {
            background: #0a0a0a;
            border-radius: 0;
            animation-timing-function: steps(2, jump-none);
        }

        html.brutalist-theme .pl-brand {
            color: #0a0a0a;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
            padding-left: 0.28em;
            animation: none;
        }

        html.brutalist-theme #preloader-tip {
            color: rgba(10, 10, 10, 0.5);
            font-size: 11px;
            font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        /* ---- dark theme (html.dark) ---- */
        html.dark .preloader {
            background: #141414;
            --pl-accent: #1677ff;
        }

        html.dark .pl-brand {
            color: rgba(255, 255, 255, 0.85);
        }

        html.dark #preloader-tip {
            color: rgba(255, 255, 255, 0.45);
        }

        html.dark.brutalist-theme .preloader {
            background-color: #141414;
            --pl-accent: #f5f5f0;
        }

        html.dark.brutalist-theme .pl-ring {
            --pl-ring-color: #f5f5f0 !important;
        }

        html.dark.brutalist-theme .pl-core,
        html.dark.brutalist-theme .pl-brand {
            background: none;
            color: #f5f5f0;
        }

        html.dark.brutalist-theme .pl-core {
            background: #f5f5f0;
        }

        /* ---- workspace skin (html.workspace) ---- */
        /* The app's brand-tinted frame, built off --pl-accent so the splash
           already carries the chrome color before Angular boots; the rings
           and the wordmark go white on it. */
        html.workspace .preloader {
            background-color: color-mix(in srgb, var(--pl-accent) 42%, #151a26);
            background-image: none;
        }

        html.workspace.dark .preloader {
            background-color: color-mix(in srgb, var(--pl-accent) 18%, #0d0f14);
        }

        /* a declaration on the child beats the inline accent on .preloader */
        html.workspace .pl-content {
            --pl-accent: #fff;
        }

        html.workspace .pl-brand {
            color: rgba(255, 255, 255, 0.85);
        }

        html.workspace #preloader-tip {
            color: rgba(255, 255, 255, 0.45);
        }

        /* ---- liquid glass skin (html.liquid-glass) ---- */
        /* Same field as the app shell, built off --pl-accent so the splash
           already carries the user's brand color before Angular boots. */
        html.liquid-glass .preloader {
            background-color: color-mix(in srgb, var(--pl-accent) 10%, #eef1f6);
            background-image:
                radial-gradient(1100px 780px at 6% -12%, color-mix(in srgb, var(--pl-accent) 62%, transparent), transparent 62%),
                radial-gradient(980px 700px at 98% -6%, color-mix(in srgb, color-mix(in srgb, var(--pl-accent) 55%, #ff5fa2) 48%, transparent), transparent 60%),
                radial-gradient(900px 820px at 46% 112%, color-mix(in srgb, color-mix(in srgb, var(--pl-accent) 55%, #3fe0cf) 48%, transparent), transparent 62%);
        }

        html.liquid-glass.dark .preloader {
            background-color: color-mix(in srgb, var(--pl-accent) 7%, #0b0d12);
            background-image:
                radial-gradient(1100px 780px at 6% -12%, color-mix(in srgb, var(--pl-accent) 44%, transparent), transparent 62%),
                radial-gradient(980px 700px at 98% -6%, color-mix(in srgb, color-mix(in srgb, var(--pl-accent) 55%, #b44aac) 32%, transparent), transparent 60%),
                radial-gradient(900px 820px at 46% 112%, color-mix(in srgb, color-mix(in srgb, var(--pl-accent) 55%, #229a9e) 30%, transparent), transparent 62%);
        }

        .preloader-hidden-add         { opacity: 1; display: flex; }
        .preloader-hidden-add-active  { opacity: 0; }
        .preloader-hidden             { display: none; }

        @media (prefers-reduced-motion: reduce) {
            .pl-ring, .pl-core, .pl-brand, .pl-content, .preloader::before { animation: none; }
        }
    </style>
</head>
<body>
<div class="preloader">
    <div class="pl-content">
        <div class="pl-orbit">
            <i class="pl-ring"></i>
            <i class="pl-ring"></i>
            <i class="pl-ring"></i>
            <b class="pl-core"></b>
        </div>
        <div class="pl-brand" id="preload-brand">Loading</div>
    </div>
    <div id="preloader-tip">Stuck? Press Ctrl + Shift + R to reload.</div>
</div>
<script>
    window.setTimeout(function () {
        if (!window.eruptWebSuccess) {
            location.reload(true)
        }
    }, 1000 * 20);
    (function (date) {
        var __t__ = '' + date.getFullYear() + date.getMonth() + date.getDate() + date.getHours() + date.getMinutes();
        document.write(
            "<link rel=\"stylesheet\" href=\"app.css?_=" + __t__ + "\" type=\"text/css\"/>" +
            "<script type=\"text/javascript\" src=\"app.js?_=" + __t__ + "\"><\/script>" +
            "<script type=\"module\" src=\"app.module.js?_=" + __t__ + "\" ><\/script>"
        );
        var _preloaderEl = document.querySelector(".preloader");
        var _brandEl = document.getElementById("preload-brand");
        // Optional Brutalist Theme skin — apply a saved user toggle right away so
        // the preloader renders with the correct skin, without waiting for app.js.
        var _nbPref = localStorage.getItem("brutalist-theme");
        if (_nbPref === "true") {
            document.documentElement.classList.add("brutalist-theme");
        }
        // Optional Liquid Glass skin — same pre-bootstrap treatment. Mutually
        // exclusive with the brutalist skin; the saved brutalist flag wins.
        var _lgPref = localStorage.getItem("liquid-glass");
        if (_lgPref === "true" && _nbPref !== "true") {
            document.documentElement.classList.add("liquid-glass");
        }
        // Optional Workspace skin (chat-app frame) — same treatment; any other
        // saved skin flag wins.
        var _wsPref = localStorage.getItem("workspace");
        if (_wsPref === "true" && _nbPref !== "true" && _lgPref !== "true") {
            document.documentElement.classList.add("workspace");
        }
        // Optional Classic skin (Ant Design Pro navy column) — same treatment.
        var _cpPref = localStorage.getItem("classic");
        if (_cpPref === "true" && _nbPref !== "true" && _lgPref !== "true" && _wsPref !== "true") {
            document.documentElement.classList.add("classic");
        }
        // A saved workspace frame gradient (settings drawer stores the whole
        // preset) tints the preloader the same way the app shell will be.
        var _paintWorkspacePreloader = function () {
            if (!document.documentElement.classList.contains("workspace")) {
                return;
            }
            var frame = null;
            try {
                frame = JSON.parse(localStorage.getItem("workspace-frame") || "null");
            } catch (e) {
            }
            if (frame && frame.frame) {
                _preloaderEl.style.backgroundImage = frame.frame;
                _preloaderEl.style.backgroundColor = frame.solid || "";
                if (frame.light) {
                    // ink on a light frame; the rings take the preset's accent instead of white
                    var content = _preloaderEl.querySelector(".pl-content");
                    if (content) content.style.setProperty("--pl-accent", frame.accent || "#3370ff");
                    if (_brandEl) _brandEl.style.color = "rgba(0, 0, 0, 0.72)";
                    var tip = document.getElementById("preloader-tip");
                    if (tip) tip.style.color = "rgba(0, 0, 0, 0.40)";
                }
            }
        };
        _paintWorkspacePreloader();
        // Theme bundles: dark and compact are compiled as separate lazy
        // stylesheets; using both loads the merged compact-dark bundle.
        // One <link> is swapped between the three — shared with the settings
        // drawer via window.eruptApply*Theme so the logic lives in one place.
        // The <link> is created once, pre-bootstrap, and never removed: it must
        // stay BEFORE Angular's runtime-injected component <style> tags, so the
        // cascade order is identical whether a theme was on at load or toggled
        // later (appending it at runtime let the bundle's @delon defaults beat
        // equal-specificity component overrides, e.g. the reuse-tab bar).
        var _themeLink = document.createElement("link");
        _themeLink.id = "site-theme-style";
        _themeLink.rel = "stylesheet";
        _themeLink.disabled = true;
        document.head.appendChild(_themeLink);
        window.eruptSyncThemeBundles = function () {
            var cls = document.documentElement.classList;
            var dark = cls.contains("dark");
            var compact = cls.contains("compact");
            var href = dark && compact ? "style.compact-dark.css"
                : dark ? "style.dark.css"
                    : compact ? "style.compact.css" : null;
            if (!href) {
                _themeLink.disabled = true;
                return;
            }
            href += "?_=" + __t__;
            if (_themeLink.getAttribute("href") !== href) {
                _themeLink.setAttribute("href", href);
            }
            _themeLink.disabled = false;
        };
        window.eruptApplyDarkTheme = function (dark) {
            document.documentElement.classList.toggle("dark", dark);
            window.eruptSyncThemeBundles();
            window.eruptSyncThemeColor();
        };
        window.eruptApplyCompactTheme = function (compact) {
            document.documentElement.classList.toggle("compact", compact);
            window.eruptSyncThemeBundles();
        };
        // The browser tab icon. One <link> is swapped, so the built-in
        // favicon.ico, an eruptSiteConfig.faviconPath and anything set later
        // (tenant js, a custom theme) all go through the same node. No type
        // attribute: an .ico, a .png and an .svg all work as written.
        window.eruptApplyFavicon = function (path) {
            var link = document.getElementById("site-favicon");
            if (link && path) {
                link.setAttribute("href", path);
            }
        };
        // The browser UI color (<meta name="theme-color">: the tab strip on Android,
        // the title bar of an installed app). The two built-in metas hold the light
        // and dark defaults matching the plain top bar; a color replaces both, null
        // puts the defaults back. Only eruptSyncThemeColor() writes it, from what
        // the page shows, so the browser chrome always continues the bar.
        var _setThemeColorMeta = function (color) {
            document.querySelectorAll("meta[name='theme-color']").forEach(function (m) {
                if (!m.dataset.defaultContent) {
                    m.dataset.defaultContent = m.getAttribute("content");
                }
                m.setAttribute("content", color || m.dataset.defaultContent);
            });
        };
        // Read the bar once it has painted: a skin may recolor it and ng-zorro
        // writes the palette asynchronously. Called pre-bootstrap (the preloader
        // stands in for the bar), after a theme bundle swap, by the header once it
        // exists and on every header color change, and whenever a modal / drawer
        // mask comes or goes (see the overlay observer below).
        var _readThemeColor;
        window.eruptSyncThemeColor = function () {
            var channels = function (color) {
                var m = color && color.match(/rgba?\(([^)]+)\)/);
                return m ? m[1].split(/[\s,\/]+/).filter(Boolean).map(parseFloat) : null;
            };
            // The masks lying over the top strip, as [r, g, b, a] layers at the
            // strength painted (color alpha × element opacity). Masks do not fade
            // in the overlay mode (pwa.less), so one read per change is exact.
            var maskLayers = function () {
                var layers = [];
                document.querySelectorAll(".ant-modal-mask, .ant-drawer-mask, .cdk-overlay-backdrop").forEach(function (m) {
                    var cs = getComputedStyle(m);
                    var r = m.getBoundingClientRect();
                    if (cs.display === "none" || cs.visibility === "hidden" || r.width === 0 || r.top > 0 || r.bottom <= 0) {
                        return;
                    }
                    var c = channels(cs.backgroundColor);
                    var opacity = parseFloat(cs.opacity);
                    var alpha = (c ? (c.length > 3 ? c[3] : 1) : 0) * (isNaN(opacity) ? 1 : opacity);
                    if (c && alpha > 0) {
                        layers.push([c[0], c[1], c[2], alpha]);
                    }
                });
                return layers;
            };
            // Source-over compositing of the mask layers onto the bar color, the
            // same blend the page itself shows where a mask covers the bar
            var composite = function (color, layers) {
                var c = channels(color);
                if (!c || !layers.length) {
                    return color;
                }
                var out = c.slice(0, 3);
                layers.forEach(function (l) {
                    out = out.map(function (v, i) { return v * (1 - l[3]) + l[i] * l[3]; });
                });
                return "rgb(" + out.map(Math.round).join(", ") + ")";
            };
            // The color an element shows on screen: a skin may leave the bar
            // transparent (workspace, painted by the frame on <body>) or translucent
            // (liquid glass, a tint over the canvas), so composite its background
            // over its ancestors' down to the first opaque one, white failing that.
            // Gradient images are not sampled; their background-color stands in.
            var painted = function (el) {
                var base = null;
                var stack = [];
                for (var n = el; n && !base; n = n.parentElement) {
                    var c = channels(getComputedStyle(n).backgroundColor);
                    var alpha = c ? (c.length > 3 ? c[3] : 1) : 0;
                    if (alpha >= 1) {
                        base = "rgb(" + c.slice(0, 3).join(", ") + ")";
                    } else if (alpha > 0) {
                        stack.unshift([c[0], c[1], c[2], alpha]);
                    }
                }
                return (base || stack.length) ? composite(base || "rgb(255, 255, 255)", stack) : null;
            };
            var read = function () {
                // No bar: the login page's top nav, or the preloader before bootstrap,
                // stands in; nothing at all leaves the light / dark defaults.
                var surface = document.querySelector(".erupt-header, .alain-default__header, .lp-side-nav")
                    || (_preloaderEl && _preloaderEl.parentNode && getComputedStyle(_preloaderEl).display !== "none" ? _preloaderEl : null);
                var base = surface ? painted(surface) : null;
                // The same color, before any mask, for the page: in the overlay
                // mode the bar paints itself flat in it (pwa.less), so the bar and
                // the corners around the window controls read as one strip even
                // over a gradient frame or a picture the corners cannot show.
                if (base) {
                    document.documentElement.style.setProperty("--erupt-titlebar-color", base);
                } else {
                    document.documentElement.style.removeProperty("--erupt-titlebar-color");
                }
                _setThemeColorMeta(base ? composite(base, maskLayers()) : null);
            };
            _readThemeColor = read;

            // palette and a swapped theme bundle applies a little later. Timers
            // rather than requestAnimationFrame, so a background window gets them.
            read();
            setTimeout(read, 100);
            setTimeout(read, 500);
        };
        // Modals and drawers (their masks included) live in the CDK overlay
        // container, created lazily under <body>. Watch for the container, then
        // watch its subtree so every mask entering, fading or leaving re-syncs.

            // Written in the same task as the mutation, before the frame paints

                (_readThemeColor || window.eruptSyncThemeColor)();
            };

                new MutationObserver(onOverlayChange).observe(container, {
                    childList: true, subtree: true, attributes: true, attributeFilter: ["class", "style"]
                });
            };

            if (existing) {
                watchOverlays(existing);
            }
            new MutationObserver(function (list) {
                list.forEach(function (m) {
                    m.addedNodes.forEach(function (n) {
                        if (n.nodeType === 1 && n.classList.contains("cdk-overlay-container")) {
                            watchOverlays(n);
                        }
                    });
                });
            }).observe(document.body, {childList: true});
        })();
        // The web app manifest. manifest.json stays the static default; a branded
        // site re-issues it as a blob: URL with its own name / theme_color so the
        // installed app carries them. A blob manifest has no base URL, so every
        // relative reference is made absolute against the page first. Chrome reads
        // the manifest lazily and follows href changes, so async is fine here.
        // The installed app's manifest: manifest.json re-issued as a blob: URL with
        // the site's name / description / color and eruptSiteConfig.pwa's icon and
        // shortcuts. A blob manifest has no base URL, so every relative reference
        // is made absolute against the page.

            var link = document.querySelector("link[rel='manifest']");
            if (!link) {
                return;
            }

            var abs = function (url) {
                return new URL(url, base).href;
            };
            var th = cfg.theme || {};
            var pwa = cfg.pwa || {};

            // to any size; a raster is loaded once and measured, since installation
            // needs its real pixel size in `sizes`.
            var iconEntries = function (path, purposes) {
                var ext = (path.match(/\.([a-z0-9]+)(?:[?#]|$)/i) || ["", ""])[1].toLowerCase();
                var type = {svg: "image/svg+xml", png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", webp: "image/webp", ico: "image/x-icon"}[ext];
                return new Promise(function (resolve) {
                    var done = function (sizes) {
                        resolve((purposes || ["any"]).map(function (purpose) {
                            return {src: abs(path), sizes: sizes, type: type, purpose: purpose};
                        }));

                    if (ext === "svg") {
                        return done("any");
                    }
                    var img = new Image();
                    img.onload = function () {
                        done(img.naturalWidth + "x" + img.naturalHeight);
                    };

                        done("any");
                    };
                    img.src = path;
                });
            };

                fetch(link.href).then(function (r) {
                    return r.json();
                }),
                pwa.icon ? iconEntries(pwa.icon, ["any", "maskable"]) : null,
                // Shortcuts in manifest shape, `icon: "path"` as shorthand for one image
                Promise.all((pwa.shortcuts || []).map(function (sc) {
                    return (sc.icon ? iconEntries(sc.icon) : Promise.resolve(sc.icons)).then(function (icons) {
                        return {name: sc.name, short_name: sc.shortName, description: sc.description, url: sc.url, icons: icons};
                    });
                }))
            ]).then(function (r) {
                var m = r[0];
                var name = cfg.logoText || cfg.title;
                var brand = (th.headerColor && th.headerColor !== "primary") ? th.headerColor : th.primaryColor;
                if (name) {
                    m.name = m.short_name = name;
                }
                if (cfg.desc) {
                    m.description = cfg.desc;
                }
                if (brand) {
                    m.theme_color = brand;
                }
