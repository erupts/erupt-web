<div class="icon-selector-content">
  <!-- Live preview beside the color swatches; the icon itself comes from erupt-icon-picker below -->
  <div class="pick-row">
    <div class="preview-icon" [style]="getPreviewIconStyle()">
      <i class="{{ previewIcon }}"></i>
    </div>
    <div class="color-grid">
      @for (color of bgColors; track color) {
        <div class="color-item"
          [class.selected]="previewColor === color"
          [style]="getIconOptionStyle(color)"
          [title]="color"
          (click)="selectColor(color, $event)">
        </div>
      }
    </div>
  </div>

  <div class="icon-row">
    <erupt-icon-picker [ngModel]="previewIcon" (ngModelChange)="selectIcon($event)" name="flowIcon" [showColors]="false"
                       [placeholder]="'flow.icon.select_icon' | translate"></erupt-icon-picker>
  </div>

  <div class="action-buttons">
    <button nz-button nzType="default" nzSize="small" (click)="cancelSelection()">
      {{ 'global.cancel' | translate }}
    </button>
    <button nz-button nzType="primary" nzSize="small" (click)="confirmSelection()">
      {{ 'flow.icon.confirm_select' | translate }}
    </button>
  </div>
</div>
