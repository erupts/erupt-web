<!-- In side-panel mode the left edge is draggable (nz-resizable); the body delta is translated
     to the modal width by FormModalService. -->
<div class="erupt-form-body" nz-resizable nzBounds="window" [nzMinWidth]="320"
     [nzDisabled]="panelMode !== FormPanelMode.SIDE" (nzResize)="onPanelResize($event)">
  @if (panelMode === FormPanelMode.SIDE) {
    <nz-resize-handles [nzDirections]="['left']"></nz-resize-handles>
  }
  @if (eruptBuildModel!=null) {
    <nz-spin [nzSpinning]="loading">
      <erupt-edit-type [loading]="loading" #eruptEdit [eruptBuildModel]="eruptBuildModel" [readonly]="readonly"
      [mode]="behavior" [size]="size"></erupt-edit-type>
    </nz-spin>
  }
</div>

<ng-template #footerTpl let-modalRef="modalRef">
  @if (footerButtons) {
    @for (b of footerButtons; track $index) {
      <button nz-button [hidden]="buttonProp(b, 'show') === false" [nzLoading]="buttonProp(b, 'loading')"
              [disabled]="buttonProp(b, 'disabled')" [nzType]="b.type || 'default'" [nzDanger]="b.danger"
              (click)="clickButton(b)">{{b.label}}</button>
    }
  } @else {
    <button nz-button (click)="modalRef.triggerCancel()"
            [nzLoading]="modalRef.getConfig().nzCancelLoading">{{'global.cancel' | translate}}</button>
    <button nz-button nzType="primary" (click)="modalRef.triggerOk()"
            [nzLoading]="modalRef.getConfig().nzOkLoading">{{okText || ('global.ok' | translate)}}</button>
  }
</ng-template>

<!-- Title bar: caption on the left, the three panel forms on the right. mousedown is stopped so
     clicking a mode icon never starts the modal drag (the header is the cdk drag handle). -->
<ng-template #titleTpl>
  <div class="erupt-form-title">
    <span class="erupt-form-title__text">{{title}}</span>
    @if (navigator) {
      <!-- previous / next record within the list that opened the panel -->
      <span class="erupt-form-title__nav" (mousedown)="$event.stopPropagation()">
        <span class="erupt-form-title__action" [class.erupt-form-title__action--disabled]="!navigator.canStep(-1)"
              nz-tooltip [nzTooltipTitle]="'form.prev_record' | translate" (click)="navigator.canStep(-1) && stepRecord.emit(-1)">
          <i nz-icon nzType="left"></i>
        </span>
        <span class="erupt-form-title__action" [class.erupt-form-title__action--disabled]="!navigator.canStep(1)"
              nz-tooltip [nzTooltipTitle]="'form.next_record' | translate" (click)="navigator.canStep(1) && stepRecord.emit(1)">
          <i nz-icon nzType="right"></i>
        </span>
      </span>
    }
    <span class="erupt-form-title__spacer"></span>
    @if (canToggleEdit || link) {
      <span class="erupt-form-title__actions" (mousedown)="$event.stopPropagation()">
        @if (canToggleEdit) {
          <span class="erupt-form-title__action" nz-tooltip
                [nzTooltipTitle]="(readonly ? 'global.editor' : 'global.view') | translate" (click)="toggleEdit.emit()">
            <i nz-icon [nzType]="readonly ? 'edit' : 'eye'"></i>
          </span>
        }
        @if (link) {
          <span class="erupt-form-title__action" nz-tooltip [nzTooltipTitle]="'global.copy_link' | translate"
                (click)="copyLink.emit()">
            <i nz-icon nzType="link"></i>
          </span>
        }
      </span>
    }
    <span class="erupt-form-title__modes" (mousedown)="$event.stopPropagation()">
      @for (m of panelModes; track m.mode) {
        <span class="erupt-form-title__mode" [class.erupt-form-title__mode--active]="panelMode === m.mode"
              nz-tooltip [nzTooltipTitle]="m.i18n | translate" (click)="panelModeChange.emit(m.mode)">
          <!-- window pictogram: the frame is the page, the filled block is where the panel sits -->
          <svg viewBox="0 0 16 12" width="16" height="12" aria-hidden="true">
            <rect x=".5" y=".5" width="15" height="11" rx="1.5" fill="none" stroke="currentColor" opacity=".4"/>
            @switch (m.mode) {
              @case (FormPanelMode.SIDE) {
                <rect x="9" y="2" width="5" height="8" rx="1" fill="currentColor"/>
              }
              @case (FormPanelMode.FULL) {
                <rect x="2" y="2" width="12" height="8" rx="1" fill="currentColor"/>
              }
              @default {
                <rect x="4.5" y="3" width="7" height="6" rx="1" fill="currentColor"/>
              }
            }
          </svg>
        </span>
      }
    </span>
  </div>
</ng-template>
