<div class="erupt-multi-form">
    @for (block of pagedBlocks; track block; let i = $index) {
        <div class="multi-form-block">
            @if (!onlyRead) {
                <div class="multi-form-block-bar">
                    <span class="block-index">#{{ pageOffset + i + 1 }}</span>
                    <span>
                        <button nz-button nzType="link" nzSize="small"
                                nz-tooltip [nzTooltipTitle]="'global.copy' | translate"
                                (click)="copyBlock(pageOffset + i)">
                            <span nz-icon nzType="copy" nzTheme="outline"></span>
                        </button>
                        <button nz-button nzType="link" nzSize="small"
                                nz-popconfirm [nzPopconfirmTitle]="'table.delete.hint' | translate"
                                (nzOnConfirm)="removeBlock(pageOffset + i)">
                            <span nz-icon nzType="delete" nzTheme="twotone" nzTwotoneColor="#f00"></span>
                        </button>
                    </span>
                </div>
            }
            <erupt-edit-type [eruptBuildModel]="block.build"
                             [readonly]="onlyRead"
                             [col]="col"
                             [parentEruptName]="eruptBuildModel.eruptModel.eruptName"></erupt-edit-type>
        </div>
    }
    @if (blocks.length > pageSize) {
        <div class="multi-form-pagination">
            <nz-pagination [(nzPageIndex)]="pageIndex" [nzTotal]="blocks.length"
                           [nzPageSize]="pageSize" nzSize="small"></nz-pagination>
        </div>
    }
    @if (!onlyRead) {
        <button nz-button nzType="dashed" nzBlock [nzLoading]="adding" (click)="addBlock()">
            <span nz-icon nzType="plus" nzTheme="outline"></span>{{ 'global.new' | translate }}
        </button>
    } @else if (!blocks.length) {
        <nz-empty nzNotFoundImage="simple"></nz-empty>
    }
</div>
