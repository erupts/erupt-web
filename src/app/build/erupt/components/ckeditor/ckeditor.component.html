<nz-spin [nzSpinning]="loading">
  @if (!editorError) {
    <div class="erupt-ck" [class.erupt-ck-readonly]="readonly">
      <!-- Hidden (not removed) in read-only mode: the toolbar element is appended here
           once by the editor instance, and every command it drives is force-disabled. -->
      <div id="toolbar-container" [hidden]="readonly"></div>
      <div id="editor" [style.height.px]="height"></div>
    </div>
  }
  @if (editorError) {
    <div>
      <p style="color: red">The text editor cannot be loaded. It is recommended to replace or upgrade your browser</p>
      <textarea nz-input class="erupt-input" [name]="eruptField?.fieldName || 'ckeditor'"
        [nzAutosize]="{ minRows: 3, maxRows: 20 }"
        [ngModel]="value"
        (ngModelChange)="valueChange.emit($event)"
        [placeholder]="'The text editor cannot be loaded. It is recommended to replace or upgrade your browser'"
        [required]="!!eruptField?.eruptFieldJson?.edit?.notNull"
        [disabled]="readonly"
      ></textarea>
    </div>
  }
</nz-spin>
