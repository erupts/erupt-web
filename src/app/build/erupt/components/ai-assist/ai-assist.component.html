@if (enabled) {
    <button type="button" class="ai-trigger" [class.ai-trigger--busy]="running"
            [class.ai-trigger--pill]="variant === variantEnum.PILL"
            [disabled]="disabled"
            nz-tooltip [nzTooltipTitle]="variant === variantEnum.PILL ? '' : ((running ? 'ai_assist.stop' : 'ai_assist.title') | translate)"
            nz-popover [nzPopoverTrigger]="running ? null : 'click'" nzPopoverPlacement="bottomRight"
            [nzPopoverContent]="aiPanel" nzPopoverOverlayClassName="ai-assist-overlay"
            [(nzPopoverVisible)]="panelVisible"
            (click)="onTriggerClick($event)">
        <span class="ai-trigger__mark">
            <span class="ai-trigger__glow"></span>
            <svg class="ai-trigger__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M8 1.4 9.25 5.15 13 6.4 9.25 7.65 8 11.4 6.75 7.65 3 6.4 6.75 5.15Z" fill="currentColor"/>
                <path d="M12.6 10.2 13.05 11.55 14.4 12 13.05 12.45 12.6 13.8 12.15 12.45 10.8 12 12.15 11.55Z" fill="currentColor"/>
            </svg>
        </span>
        @if (variant === variantEnum.PILL) {
            <span class="ai-trigger__label">{{ (running ? 'ai_assist.stop' : 'ai_assist.pill') | translate }}</span>
        }
    </button>
}

<ng-template #aiPanel>
    <div class="ai-panel">
        <div class="ai-panel__prompt" [class.is-focused]="promptFocused">
            <svg class="ai-panel__prompt-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M8 1.4 9.25 5.15 13 6.4 9.25 7.65 8 11.4 6.75 7.65 3 6.4 6.75 5.15Z" fill="currentColor"/>
            </svg>
            <input class="ai-panel__input" [(ngModel)]="instruction"
                   [placeholder]="'ai_assist.placeholder' | translate"
                   (focus)="promptFocused = true" (blur)="promptFocused = false"
                   (keydown.enter)="run(action.CUSTOM)"/>
            <button type="button" class="ai-panel__send" [disabled]="!instruction.trim()"
                    [title]="'ai_assist.send' | translate" (click)="run(action.CUSTOM)">
                <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path d="M8 13V3.6M4.2 7.4 8 3.4l3.8 4" stroke="currentColor" stroke-width="1.4"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>

        <div class="ai-panel__list">
            <button type="button" class="ai-panel__item" (click)="run(action.GENERATE)">
                <svg class="ai-panel__item-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path d="M7 1.8 8.05 4.95 11.2 6 8.05 7.05 7 10.2 5.95 7.05 2.8 6 5.95 4.95Z" fill="currentColor"/>
                    <path d="M12.2 9.4 12.6 10.6 13.8 11 12.6 11.4 12.2 12.6 11.8 11.4 10.6 11 11.8 10.6Z" fill="currentColor"/>
                </svg>
                <span>{{ 'ai_assist.generate' | translate }}</span>
            </button>
            @if (hasContent) {
                <button type="button" class="ai-panel__item" (click)="run(action.POLISH)">
                    <svg class="ai-panel__item-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="m2.6 13.4 6.6-6.6M9 4.6l2.4 2.4" stroke="currentColor" stroke-width="1.3"
                              stroke-linecap="round"/>
                        <path d="M10.2 3.4 12.6 5.8 14 4.4 11.6 2Z" fill="currentColor"/>
                        <path d="M4.4 2 4.75 3.05 5.8 3.4 4.75 3.75 4.4 4.8 4.05 3.75 3 3.4 4.05 3.05Z" fill="currentColor"/>
                    </svg>
                    <span>{{ 'ai_assist.polish' | translate }}</span>
                </button>
                <button type="button" class="ai-panel__item" (click)="run(action.CONTINUE)">
                    <svg class="ai-panel__item-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="M2.6 4h10.8M2.6 8h10.8M2.6 12h5" stroke="currentColor" stroke-width="1.3"
                              stroke-linecap="round"/>
                        <path d="M9.4 12h4.2m-1.6-1.7 1.7 1.7-1.7 1.7" stroke="currentColor" stroke-width="1.3"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>{{ 'ai_assist.continue' | translate }}</span>
                </button>
                <button type="button" class="ai-panel__item" (click)="run(action.EXPAND)">
                    <svg class="ai-panel__item-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="M8 6.4V1.8m-2 2.3 2-2.3 2 2.3M8 9.6v4.6m-2-2.3 2 2.3 2-2.3" stroke="currentColor"
                              stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>{{ 'ai_assist.expand' | translate }}</span>
                </button>
                <button type="button" class="ai-panel__item" (click)="run(action.SHORTEN)">
                    <svg class="ai-panel__item-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="M8 1.8v4.6m-2-2.3 2 2.3 2-2.3M8 14.2V9.6m-2 2.3 2-2.3 2 2.3" stroke="currentColor"
                              stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>{{ 'ai_assist.shorten' | translate }}</span>
                </button>
            }
        </div>

        @if (canUndo) {
            <div class="ai-panel__footer">
                <button type="button" class="ai-panel__item ai-panel__item--quiet" (click)="undo()">
                    <svg class="ai-panel__item-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="M3.2 8a4.8 4.8 0 1 1 1.6 3.6" stroke="currentColor" stroke-width="1.3"
                              stroke-linecap="round"/>
                        <path d="M3.2 5.2v2.9h2.9" stroke="currentColor" stroke-width="1.3"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>{{ 'ai_assist.undo' | translate }}</span>
                </button>
            </div>
        }
    </div>
</ng-template>
