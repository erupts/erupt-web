<nz-alert nzType="info" nzShowIcon style="margin-bottom: 16px"
          [nzMessage]="('table.batch_edit.hint'|translate).replace('{}', count + '')"></nz-alert>
<nz-select style="width: 100%; margin-bottom: 16px" nzShowSearch [nzDisabled]="saving"
           [nzPlaceHolder]="'table.batch_edit.field'|translate"
           [(ngModel)]="fieldName" (ngModelChange)="pick($event)">
    @for (field of fields; track field.fieldName) {
        <nz-option [nzValue]="field.fieldName" [nzLabel]="field.eruptFieldJson.edit.title"></nz-option>
    }
</nz-select>
<!-- erupt-edit-type reads its model once in ngOnInit; pick() builds a new model object, so tracking by
     identity rebuilds the editor (a key off the component, like fieldName, is re-read for the old row too) -->
@for (m of model ? [model] : []; track m) {
    <erupt-edit-type [eruptBuildModel]="m" [col]="col" size="default" layout="vertical"
                     [mode]="Scene.EDIT" [readonly]="saving"/>
}
